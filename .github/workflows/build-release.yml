name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Permanently Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK (Permanently Fixed Keystore)
        run: |
          flutter build apk --release

      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk luhao-ledger-v1.0.0-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luhao-ledger-v1.0.0-release
          path: luhao-ledger-v1.0.0-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: 路皓智能记账 v1.0.0 智能OCR识图与AI人名别名解析首发版
          body_path: assets/version.json
          files: |
            luhao-ledger-v1.0.0-release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
